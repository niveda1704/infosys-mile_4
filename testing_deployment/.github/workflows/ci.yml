name: CI/CD

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: swipex }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # test-only values; real secrets live in the host's environment, never in Git
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/swipex
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/swipex
      JWT_SECRET_KEY: ci-only-secret-ci-only-secret-ci-only
      EMBEDDING_FORCE_FALLBACK: "1"
      RATE_LIMIT_AUTH_PER_MIN: "5000"
      RATE_LIMIT_GENERAL_PER_MIN: "50000"
      RATE_LIMIT_AI_PER_MIN: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: |
          pip install pytest requests bcrypt "psycopg[binary]"
          for s in auth job resume; do pip install -r backend_jayashree/services/$s-service/requirements.txt; done
          pip install -r backend_jayashree/gateway/requirements.txt
          grep -v sentence-transformers artificial_intelligence_meghana/requirements.txt > /tmp/ai-req.txt
          pip install -r /tmp/ai-req.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_units.py
      - name: Create tables and seed
        run: python scripts/init_db.py && python scripts/seed_jobs.py
      - name: Start the stack
        run: |
          python scripts/run_all.py > /tmp/stack.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:5000/health | grep -q '"status":"ok"' && break; sleep 2; done
          curl -s localhost:5000/health
      - name: End-to-end tests through the gateway
        run: |
          python tests/e2e_gateway.py
          python tests/e2e_milestone4.py
      - if: failure()
        run: tail -n 150 /tmp/stack.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - { name: auth,     file: deploy/Dockerfile.flask, args: "SERVICE_DIR=backend_jayashree/services/auth-service" }
          - { name: job,      file: deploy/Dockerfile.flask, args: "SERVICE_DIR=backend_jayashree/services/job-service" }
          - { name: resume,   file: deploy/Dockerfile.flask, args: "SERVICE_DIR=backend_jayashree/services/resume-service" }
          - { name: gateway,  file: deploy/Dockerfile.flask, args: "SERVICE_DIR=backend_jayashree/gateway\nAPP_MODULE=app:app" }
          - { name: ai,       file: deploy/Dockerfile.ai,    args: "" }
          - { name: frontend, file: deploy/Dockerfile.frontend, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Runs only on main after everything above is green. Each hook is a secret you create in
    # GitHub -> Settings -> Secrets (free-tier hosts such as Render expose a "Deploy Hook" URL per service).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploys
        env:
          HOOKS: ${{ secrets.DEPLOY_HOOKS }}   # space-separated list of deploy-hook URLs
        run: |
          if [ -z "$HOOKS" ]; then echo "DEPLOY_HOOKS secret not set - skipping deploy"; exit 0; fi
          for h in $HOOKS; do curl -fsS -X POST "$h" > /dev/null && echo "deploy triggered"; done
