[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/integrations/storage/minio_storage.py",
    "app/integrations/push/fcm_sender.py",
    "alembic/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true